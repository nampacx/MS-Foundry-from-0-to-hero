# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: stark
metadata:
  template: foundry-from-0-to-hero

# Needs the Foundry azd extensions for the azure.ai.* hosts:  azd extension install microsoft.foundry
# Pin the azd and extension versions this tutorial was tested with (old agents extensions still demand agent.yaml).
requiredVersions:
  azd: ">= 1.36.0"
  extensions:
    azure.ai.agents: "=1.0.0-beta.20"
    azure.ai.projects: "=1.0.0-beta.14"

infra:
  provider: bicep
  path: infra/azd
  module: main

services:
  stark-mcp:             # our MCP server (Python Azure Function, Flex Consumption), chapter 06
    project: ./src/stark-mcp
    language: python
    host: function

  ai-project:            # connect to the project that Bicep created (no new project is provisioned)
    host: azure.ai.project
    endpoint: ${STARK_PROJECT_ENDPOINT}

  jarvis-hosted:         # J.A.R.V.I.S. as a hosted agent (your code, Responses protocol), chapter 09
    host: azure.ai.agent
    project: src/jarvis-hosted
    uses:
      - ai-project
    kind: hosted
    name: jarvis-hosted
    description: J.A.R.V.I.S. hosted agent built with Microsoft Agent Framework.
    protocols:
      - protocol: responses
        version: 2.0.0
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    env:
      MODEL_DEPLOYMENT_NAME: ${STARK_CHAT_MODEL}
    container:
      resources:
        cpu: "0.25"
        memory: 0.5Gi

  jarvis-skills:         # the same J.A.R.V.I.S., but skills load on demand (Agent Framework SkillsProvider), chapter 09
    host: azure.ai.agent
    project: src/jarvis-skills
    uses:
      - ai-project
    kind: hosted
    name: jarvis-skills
    description: J.A.R.V.I.S. hosted agent that loads skills on demand with Agent Framework SkillsProvider.
    protocols:
      - protocol: responses
        version: 2.0.0
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    env:
      MODEL_DEPLOYMENT_NAME: ${STARK_CHAT_MODEL}
    container:
      resources:
        cpu: "0.25"
        memory: 0.5Gi

  invoice-workflow:      # the chapter 15 invoice pipeline as a hosted agent (native Agent Framework workflow), chapter 15
    host: azure.ai.agent
    project: src/invoice-workflow
    uses:
      - ai-project
    kind: hosted
    name: invoice-workflow
    description: Invoice pipeline (extractor, reviewer, reporter) as an Agent Framework workflow.
    protocols:
      - protocol: responses
        version: 2.0.0
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    env:
      MODEL_DEPLOYMENT_NAME: ${STARK_CHAT_MODEL}
      DOCUMENT_INTELLIGENCE_ENDPOINT: ${STARK_ACCOUNT_ENDPOINT}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi

  morning-briefing:      # J.A.R.V.I.S.'s morning briefing: a concurrent Agent Framework workflow as a hosted agent, chapter 15
    host: azure.ai.agent
    project: src/morning-briefing
    uses:
      - ai-project
    kind: hosted
    name: morning-briefing
    description: Concurrent workflow (suits, workshop, finance in parallel) merged into a morning briefing by J.A.R.V.I.S.
    protocols:
      - protocol: responses
        version: 2.0.0
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    env:
      MODEL_DEPLOYMENT_NAME: ${STARK_CHAT_MODEL}
      STARK_MCP_URL: ${STARK_MCP_URL}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi

hooks:
  postprovision:         # write .env for the notebooks from the azd environment values
    posix: { shell: sh, run: 'python3 scripts/write_env.py' }
    windows: { shell: pwsh, run: 'python scripts/write_env.py; exit $LASTEXITCODE' }
  predeploy:             # copy skills/ into the hosted agent projects
    posix: { shell: sh, run: 'python3 scripts/sync_skills.py' }
    windows: { shell: pwsh, run: 'python scripts/sync_skills.py; exit $LASTEXITCODE' }
  postdeploy:            # create the project connection `stark-mcp` (function key) for chapter 06
    posix: { shell: sh, run: 'python3 scripts/connect_mcp.py' }
    windows: { shell: pwsh, run: 'python scripts/connect_mcp.py; exit $LASTEXITCODE' }
